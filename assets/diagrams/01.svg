<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 20 1600 760">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#607d86"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#f3f7f7"/>
  <g filter="url(#shadow)">
    <rect x="72" y="64" width="1456" height="772" rx="16" fill="#ffffff" stroke="#c8d6d8" stroke-width="2"/>
  </g>

  <!-- Arduino IDE-style title bar -->
  <rect x="72" y="64" width="1456" height="62" rx="16" fill="#00878a"/>
  <rect x="72" y="96" width="1456" height="30" fill="#00878a"/>
  <circle cx="106" cy="95" r="13" fill="#ffffff" opacity="0.95"/>
  <circle cx="106" cy="95" r="5" fill="#00878a"/>
  <circle cx="1454" cy="95" r="7" fill="#b7e3e1"/>
  <circle cx="1480" cy="95" r="7" fill="#b7e3e1"/>
  <circle cx="1506" cy="95" r="7" fill="#b7e3e1"/>

  <!-- code editor -->
  <rect x="98" y="154" width="690" height="622" fill="#fbfdfd" stroke="#d7e2e3" stroke-width="2"/>
  <rect x="98" y="154" width="690" height="52" fill="#edf4f4"/>
  <circle cx="126" cy="180" r="8" fill="#ff6b5f"/>
  <circle cx="152" cy="180" r="8" fill="#f5c451"/>
  <circle cx="178" cy="180" r="8" fill="#4fc36b"/>
  <line x1="98" y1="206" x2="788" y2="206" stroke="#d7e2e3" stroke-width="2"/>
  <rect x="98" y="206" width="54" height="570" fill="#f1f6f6"/>
  <text x="177" y="267" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="30" fill="#00878a">tone</text>
  <text x="258" y="267" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="30" fill="#263238">(</text>
  <text x="278" y="267" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="30" fill="#d35400">8</text>
  <text x="304" y="267" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="30" fill="#263238">, </text>
  <text x="335" y="267" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="30" fill="#d35400">440</text>
  <text x="399" y="267" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="30" fill="#263238">);</text>
  <line x1="177" y1="291" x2="448" y2="291" stroke="#00878a" stroke-width="3" opacity="0.25"/>
  <rect x="177" y="335" width="510" height="62" rx="10" fill="#e8f6f5" stroke="#b8dfdd"/>
  <text x="208" y="375" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" fill="#006c70">pin = 8</text>
  <rect x="177" y="423" width="510" height="62" rx="10" fill="#e8f6f5" stroke="#b8dfdd"/>
  <text x="208" y="463" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" fill="#006c70">frequency = 440 Hz</text>

  <!-- flow arrow -->
  <path d="M820 465 H910" stroke="#789095" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- waveform result panel -->
  <rect x="944" y="154" width="558" height="622" fill="#ffffff" stroke="#d7e2e3" stroke-width="2"/>
  <text x="987" y="267" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" fill="#263238">output = square wave</text>
  <rect x="987" y="330" width="472" height="270" rx="14" fill="#fbfdfd" stroke="#b8dfdd" stroke-width="3"/>
  <line x1="1022" y1="465" x2="1424" y2="465" stroke="#dce8e8" stroke-width="2"/>
  <line x1="1022" y1="382" x2="1022" y2="548" stroke="#dce8e8" stroke-width="2"/>
  <path d="M1022 530 L1022 400 L1080 400 L1080 530 L1138 530 L1138 400 L1196 400 L1196 530 L1254 530 L1254 400 L1312 400 L1312 530 L1370 530 L1370 400 L1424 400" fill="none" stroke="#00878a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="1022" y1="625" x2="1424" y2="625" stroke="#d7e2e3" stroke-width="2"/>
  <circle cx="1022" cy="625" r="5" fill="#00878a"/>
  <circle cx="1424" cy="625" r="5" fill="#00878a"/>
</svg>
